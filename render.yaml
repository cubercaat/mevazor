# One-click deploy on Render (https://render.com): New + > Blueprint > pick this repo.
# The free plan has no persistent disk, so the SQLite database resets on every deploy; use a paid plan + disk for real data.
services:
  - type: web
    name: mevazor
    runtime: docker
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
